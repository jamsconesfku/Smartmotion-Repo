<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartMotion Dashboard</title>
<meta name="description" content="Launch tracker for SmartMotion: tasks, go-live gates, contacts, licences, documents and decisions.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5eff'/%3E%3Cpath d='M7 21l6-10 4 6 3-4 5 8z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --text:#15181e; --muted:#5b6472; --border:#dde1e8;
  --accent:#1f5eff; --accent-soft:#e6edff;
  --done:#1a7f45; --done-soft:#e3f4ea; --prog:#1f5eff; --prog-soft:#e6edff;
  --wait:#a15c00; --wait-soft:#fdf0dc; --todo:#5b6472; --todo-soft:#eef0f4;
  --park:#7a5aa6; --park-soft:#f1ebf9; --late:#c4261d; --late-soft:#fde8e6;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#181b21; --surface-2:#21252d; --text:#e8eaee; --muted:#9aa3b2; --border:#2c313a;
    --accent:#6f95ff; --accent-soft:#1d2840;
    --done:#4cc282; --done-soft:#15301f; --prog:#6f95ff; --prog-soft:#1d2840;
    --wait:#e6a64a; --wait-soft:#33260f; --todo:#9aa3b2; --todo-soft:#21252d;
    --park:#b69ae0; --park-soft:#2a2238; --late:#ff6b61; --late-soft:#3a1a18; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b21; --surface-2:#21252d; --text:#e8eaee; --muted:#9aa3b2; --border:#2c313a;
  --accent:#6f95ff; --accent-soft:#1d2840;
  --done:#4cc282; --done-soft:#15301f; --prog:#6f95ff; --prog-soft:#1d2840;
  --wait:#e6a64a; --wait-soft:#33260f; --todo:#9aa3b2; --todo-soft:#21252d;
  --park:#b69ae0; --park-soft:#2a2238; --late:#ff6b61; --late-soft:#3a1a18; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);min-width:0}
.stat .n{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--done);border-radius:99px}
section.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.gate-group h3{font-size:14px;margin:0 0 6px}
.gate-group .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.gate{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid var(--border)}
.gate .dot{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.gate .dot.ok{background:var(--done);color:#fff}
.gate .dot.no{border:2px solid var(--border)}
.gate .t{font-weight:600;font-size:14px}
.gate .m{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:99px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
nav.tabs .c{opacity:.65;margin-left:4px;font-size:12px}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.filters select,.filters input{width:100%;min-width:0;font:inherit;font-size:14px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.filters .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.group{margin-bottom:18px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font-size:14px;font-weight:700}
.group-h span{font-weight:500;color:var(--muted);font-size:12px}
.task{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--todo);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.task.s-done{border-left-color:var(--done)} .task.s-in_progress{border-left-color:var(--prog)}
.task.s-waiting{border-left-color:var(--wait)} .task.s-parked{border-left-color:var(--park)}
.task.late{border-left-color:var(--late);background:linear-gradient(90deg,var(--late-soft),var(--surface) 60%)}
.task .row1{display:flex;gap:8px;align-items:flex-start}
.task .id{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);flex:none;padding-top:2px;min-width:44px}
.task .title{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.task.s-done .title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--muted);align-items:center}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-done{background:var(--done-soft);color:var(--done)} .p-in_progress{background:var(--prog-soft);color:var(--prog)}
.p-waiting{background:var(--wait-soft);color:var(--wait)} .p-todo{background:var(--todo-soft);color:var(--todo)}
.p-parked{background:var(--park-soft);color:var(--park)} .p-late{background:var(--late-soft);color:var(--late)}
.p-high{background:var(--late-soft);color:var(--late)}
.deps{margin-top:6px;font-size:12px}
.deps a{margin-right:6px}
.notes{margin-top:6px;font-size:13px;color:var(--muted)}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:0}
.item .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item .h b{overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.actions a{border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:13px;background:var(--surface-2);color:var(--text)}
.sub-h{font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.err{background:var(--late-soft);color:var(--late);border-radius:10px;padding:12px;margin-bottom:16px;font-size:14px}
footer{color:var(--muted);font-size:12px;margin-top:24px}
.hl{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){
  .stats{gap:8px} .stat{padding:10px} .stat .n{font-size:22px}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>SmartMotion<small id="asof">Launch dashboard</small></h1>
    <button class="btn" id="theme" type="button" aria-label="Toggle theme">◐</button>
  </header>

  <div id="error"></div>

  <div class="stats">
    <div class="stat"><div class="n" id="d-voucher">–</div><div class="l">days to voucher go-live<br><span id="d-voucher-date"></span></div></div>
    <div class="stat"><div class="n" id="d-riders">–</div><div class="l">days to first paying riders<br><span id="d-riders-date"></span></div></div>
    <div class="stat"><div class="n" id="pct">–</div><div class="l" id="pct-l">tasks done</div><div class="bar"><i id="pct-bar" style="width:0"></i></div></div>
  </div>

  <section class="card">
    <h2>Go-live gates</h2>
    <div class="gates" id="gates"></div>
  </section>

  <section class="card" id="attention-card">
    <h2>Needs attention</h2>
    <div id="attention"></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="panel"></main>

  <footer>Data lives in <code>data/*.json</code> in the repo. This page only reads it.</footer>
</div>

<script>
(function(){
const REPO = "https://github.com/jamsconesfku/Smartmotion-Repo/blob/main/";
const DATA = "../data/";
const FILES = ["tasks","contacts","licences","documents","decisions","milestones","changelog"];
const STATUS_ORDER = ["in_progress","todo","waiting","done","parked"];
const STATUS_LABEL = {todo:"To do",in_progress:"In progress",waiting:"Waiting",done:"Done",parked:"Parked"};
const PHASE_ORDER = ["Week 1","Week 2","Week 3","Week 4","Before first rider","Parked","Done"];
const store = {};
let D = {};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get = (k, d) => { try { const v = localStorage.getItem("sm:"+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } };
const set = (k, v) => { try { localStorage.setItem("sm:"+k, JSON.stringify(v)); } catch(e){} };

function today(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function parseDate(s){ if(!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function daysTo(s){ const d = parseDate(s); return d ? Math.round((d - today()) / 864e5) : null; }
function fmtDate(s){ const d = parseDate(s); return d ? d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : ""; }
function fmtShort(s){ const d = parseDate(s); return d ? d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : ""; }

// Theme
const themeBtn = $("#theme");
const savedTheme = get("theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
themeBtn.onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next; set("theme", next);
};

// Turn a link string into an anchor: URL, repo path, or record id.
function linkFor(l){
  if (/^https?:\/\//.test(l)) return `<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l.replace(/^https?:\/\/(www\.)?/,"").slice(0,48))}</a>`;
  if (/^(docs|data|dashboard)\//.test(l)) return `<a href="${REPO+esc(l)}" target="_blank" rel="noopener">${esc(l)}</a>`;
  if (/^DEC-/.test(l)) return `<a href="#" data-goto="decisions" data-id="${esc(l)}">${esc(l)}</a>`;
  if (D.taskById && D.taskById[l]) return `<a href="#" data-goto="tasks" data-id="${esc(l)}">${esc(l)}</a>`;
  return esc(l);
}

const isOpen = t => t.status !== "done" && t.status !== "parked";
const isLate = t => isOpen(t) && t.due && daysTo(t.due) < 0;

async function load(){
  try {
    const res = await Promise.all(FILES.map(f => fetch(DATA + f + ".json", {cache:"no-store"}).then(r => { if(!r.ok) throw new Error(f+".json: HTTP "+r.status); return r.json(); })));
    FILES.forEach((f,i) => store[f] = res[i]);
  } catch(e){
    $("#error").innerHTML = `<div class="err"><b>Couldn't load the data files.</b> ${esc(e.message)}<br>If you opened this file directly from disk, serve the repo instead (GitHub Pages, or <code>python3 -m http.server</code> in the repo root, then open <code>/dashboard/</code>).</div>`;
    return;
  }
  D = store;
  D.taskById = Object.fromEntries(D.tasks.map(t => [t.id, t]));
  renderHeader(); renderGates(); renderAttention(); renderTabs(); renderPanel();
}

function renderHeader(){
  const ms = Object.fromEntries(D.milestones.filter(m => m.type === "date").map(m => [m.id, m]));
  const v = ms["M-01"], r = ms["M-02"];
  if (v){ const n = daysTo(v.date); $("#d-voucher").textContent = n < 0 ? "Passed" : n; $("#d-voucher-date").textContent = fmtDate(v.date); }
  if (r){ const n = daysTo(r.date); $("#d-riders").textContent = n < 0 ? "Passed" : n; $("#d-riders-date").textContent = fmtDate(r.date); }
  const active = D.tasks.filter(t => t.status !== "parked");
  const done = active.filter(t => t.status === "done").length;
  const pct = active.length ? Math.round(done / active.length * 100) : 0;
  $("#pct").textContent = pct + "%";
  $("#pct-l").textContent = `${done} of ${active.length} tasks done (parked excluded)`;
  $("#pct-bar").style.width = pct + "%";
  const last = D.changelog.map(c => c.date).sort().pop();
  $("#asof").textContent = last ? "Last updated " + fmtDate(last) : "Launch dashboard";
}

function gateDone(g){
  if (g.tasks && g.tasks.length) return g.tasks.every(id => D.taskById[id] && D.taskById[id].status === "done");
  return g.status === "done";
}

function renderGates(){
  const dates = D.milestones.filter(m => m.type === "date");
  $("#gates").innerHTML = dates.map(m => {
    const gates = D.milestones.filter(g => g.type === "gate" && g.milestone === m.id);
    const ok = gates.filter(gateDone).length;
    return `<div class="gate-group">
      <h3>${esc(m.title)}</h3>
      <div class="sub">${fmtDate(m.date)} · ${ok}/${gates.length} gates met</div>
      ${gates.map(g => {
        const d = gateDone(g);
        const ts = (g.tasks||[]).map(id => { const t = D.taskById[id]; return t ? `${linkFor(id)} <span class="pill p-${t.status}">${STATUS_LABEL[t.status]}</span>` : esc(id); }).join(" ");
        return `<div class="gate"><span class="dot ${d?"ok":"no"}">${d?"✓":""}</span><div><div class="t">${esc(g.title)}</div><div class="m">${ts}</div></div></div>`;
      }).join("")}
    </div>`;
  }).join("");
}

function renderAttention(){
  const late = D.tasks.filter(isLate);
  const soon = D.tasks.filter(t => isOpen(t) && t.due && daysTo(t.due) >= 0 && daysTo(t.due) <= 7 && t.priority === "high");
  const blocks = [];
  if (late.length) blocks.push(`<div class="sub-h" style="margin-top:0">Overdue (${late.length})</div>` + late.map(t => taskCard(t,false)).join(""));
  if (soon.length) blocks.push(`<div class="sub-h"${late.length?"":" style=\"margin-top:0\""}>High priority, due within 7 days (${soon.length})</div>` + soon.map(t => taskCard(t,false)).join(""));
  $("#attention").innerHTML = blocks.length ? blocks.join("") : `<div class="empty">Nothing overdue or urgent.</div>`;
}

const TABS = [
  ["tasks","Tasks", () => D.tasks.filter(isOpen).length],
  ["contacts","Contacts", () => D.contacts.length],
  ["licences","Licences", () => D.licences.length],
  ["documents","Documents", () => D.documents.length],
  ["decisions","Decisions", () => D.decisions.filter(d => d.status === "open").length],
  ["changes","Changes", () => D.changelog.length],
];
let tab = get("tab", "tasks");
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,l,c]) => `<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${l}<span class="c">${c()}</span></button>`).join("");
}
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if(!b) return;
  tab = b.dataset.tab; set("tab", tab); renderTabs(); renderPanel();
});

function taskCard(t, withId = true){
  const late = isLate(t);
  const due = t.due ? (late ? `<span class="pill p-late">Overdue · ${fmtShort(t.due)}</span>` : `Due ${fmtShort(t.due)}`) : "";
  const deps = (t.depends_on||[]).map(id => { const d = D.taskById[id]; return d ? `${linkFor(id)}<span class="pill p-${d.status}">${STATUS_LABEL[d.status]}</span>` : esc(id); });
  const blockedBy = (t.depends_on||[]).filter(id => D.taskById[id] && D.taskById[id].status !== "done");
  return `<div class="task s-${t.status}${late?" late":""}"${withId?` id="task-${esc(t.id)}"`:""}>
    <div class="row1"><span class="id">${esc(t.id)}</span><span class="title">${esc(t.title)}</span></div>
    <div class="meta"><span class="pill p-${t.status}">${STATUS_LABEL[t.status]||esc(t.status)}</span>
      ${t.priority==="high"&&isOpen(t)?'<span class="pill p-high">High</span>':""}
      <span>${esc(t.area)}</span><span>·</span><span>${esc(t.owner)}</span>${due?`<span>·</span>${due}`:""}</div>
    ${deps.length ? `<div class="deps">${blockedBy.length && isOpen(t) ? "<b>Waiting on</b> " : "Depends on "}${deps.join(" ")}</div>` : ""}
    ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ""}
    ${t.links && t.links.length ? `<div class="deps">${t.links.map(linkFor).join(" ")}</div>` : ""}
  </div>`;
}

const F = Object.assign({status:"open", area:"", owner:"", group:"phase", q:""}, get("filters", {}));
function renderTasks(){
  const areas = [...new Set(D.tasks.map(t => t.area))].sort();
  const owners = [...new Set(D.tasks.map(t => t.owner))].sort();
  const opt = (v, l, cur) => `<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l)}</option>`;
  let html = `<div class="filters">
    <select id="f-status" aria-label="Status">${opt("open","Open (not done/parked)",F.status)}${opt("","All statuses",F.status)}${STATUS_ORDER.map(s=>opt(s,STATUS_LABEL[s],F.status)).join("")}${opt("late","Overdue",F.status)}</select>
    <select id="f-area" aria-label="Area">${opt("","All areas",F.area)}${areas.map(a=>opt(a,a,F.area)).join("")}</select>
    <select id="f-owner" aria-label="Owner">${opt("","All owners",F.owner)}${owners.map(a=>opt(a,a,F.owner)).join("")}</select>
    <select id="f-group" aria-label="Group by">${opt("phase","Group by phase",F.group)}${opt("area","Group by area",F.group)}${opt("status","Group by status",F.group)}</select>
    <input id="f-q" type="search" placeholder="Search tasks…" value="${esc(F.q)}" style="grid-column:1/-1">
  </div>`;
  const q = F.q.trim().toLowerCase();
  const list = D.tasks.filter(t =>
    (F.status === "" || (F.status === "open" ? isOpen(t) : F.status === "late" ? isLate(t) : t.status === F.status)) &&
    (!F.area || t.area === F.area) && (!F.owner || t.owner === F.owner) &&
    (!q || (t.id+" "+t.title+" "+t.notes).toLowerCase().includes(q)));
  const key = t => F.group === "phase" ? t.phase : F.group === "area" ? t.area : STATUS_LABEL[t.status];
  const order = F.group === "phase" ? PHASE_ORDER : F.group === "status" ? STATUS_ORDER.map(s=>STATUS_LABEL[s]) : null;
  const groups = {};
  list.forEach(t => (groups[key(t)] ||= []).push(t));
  const names = Object.keys(groups).sort((a,b) => order ? (order.indexOf(a)+1||99) - (order.indexOf(b)+1||99) : a.localeCompare(b));
  html += names.length ? names.map(n => {
    const g = groups[n]; const d = g.filter(t => t.status==="done").length;
    return `<div class="group"><div class="group-h">${esc(n)}<span>${d}/${g.length} done</span></div>${g.map(taskCard).join("")}</div>`;
  }).join("") : `<div class="empty">No tasks match these filters.</div>`;
  return html;
}

function tel(p){ return p ? "tel:" + p.replace(/[^\d+]/g,"").replace(/^0/,"+44") : ""; }
function renderContacts(){
  const cats = [...new Set(D.contacts.map(c => c.category))];
  const tag = {send_first:'<span class="pill p-in_progress">Send first</span>', backup:'<span class="pill p-todo">Backup</span>', testing_only:'<span class="pill p-waiting">Testing only</span>'};
  return cats.map(cat => `<div class="sub-h">${esc(cat)}</div><div class="list">` + D.contacts.filter(c => c.category === cat).map(c => `
    <div class="item"><div class="h"><b>${esc(c.organisation)}</b>${tag[c.priority]||""}</div>
      ${c.name?`<div class="s">${esc(c.name)}</div>`:""}
      ${c.address?`<div class="s">${esc(c.address)}</div>`:""}
      ${c.notes?`<div class="s">${esc(c.notes)}</div>`:""}
      ${c.status && c.status!=="n/a"?`<div class="s">Status: ${esc(c.status.replace(/_/g," "))}</div>`:""}
      <div class="actions">
        ${c.email?`<a href="mailto:${esc(c.email)}">✉ ${esc(c.email)}</a>`:""}
        ${c.phone?`<a href="${tel(c.phone)}">☎ ${esc(c.phone)}</a>`:""}
        ${c.website?`<a href="${esc(c.website)}" target="_blank" rel="noopener">↗ Website</a>`:""}
      </div></div>`).join("") + `</div>`).join("");
}

function renderLicences(){
  const cls = {to_buy:"p-todo",to_request:"p-todo",to_confirm:"p-waiting",optional:"p-parked",available:"p-done",signed:"p-done",bought:"p-done",requested:"p-in_progress",not_usable:"p-late"};
  return `<div class="list">` + D.licences.map(l => `
    <div class="item"><div class="h"><b>${esc(l.software)}</b><span class="pill ${cls[l.status]||"p-todo"}">${esc(l.status.replace(/_/g," "))}</span></div>
      <div class="s"><b>Use:</b> ${esc(l.use)} · <b>Cost:</b> ${esc(l.cost)}</div>
      <div class="s">${esc(l.commercial_route)}</div>
      ${l.notes?`<div class="s">${esc(l.notes)}</div>`:""}
      ${l.task?`<div class="s">Task: ${linkFor(l.task)}</div>`:""}
    </div>`).join("") + `</div>`;
}

function renderDocuments(){
  const cls = {in_repo:"p-done",awaiting_upload:"p-waiting",draft:"p-in_progress"};
  return `<div class="list">` + D.documents.map(d => `
    <div class="item"><div class="h"><b>${esc(d.title)}</b><span class="pill ${cls[d.status]||"p-todo"}">${esc(d.status.replace(/_/g," "))}</span></div>
      <div class="s">${esc(d.format)}${d.area?" · "+esc(d.area):""}</div>
      ${d.notes?`<div class="s">${esc(d.notes)}</div>`:""}
      <div class="actions">
        ${d.path && d.status==="in_repo"?`<a href="${REPO+esc(d.path)}" target="_blank" rel="noopener">Open in repo</a>`:d.path?`<span class="s">Expected at <code>${esc(d.path)}</code></span>`:""}
        ${(d.links||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">↗ Online version</a>`).join("")}
      </div></div>`).join("") + `</div>`;
}

function renderDecisions(){
  const card = d => `<div class="item" id="dec-${esc(d.id)}"><div class="h"><b>${esc(d.question)}</b><span class="pill ${d.status==="open"?"p-waiting":"p-done"}">${esc(d.status)}</span></div>
      ${d.recommendation?`<div class="s"><b>Recommended:</b> ${esc(d.recommendation)}</div>`:""}
      ${d.decision && d.status!=="open"?`<div class="s"><b>Decision:</b> ${esc(d.decision)}</div>`:""}
      ${d.related_tasks&&d.related_tasks.length?`<div class="s">Tasks: ${d.related_tasks.map(linkFor).join(" ")}</div>`:""}
      <div class="s">${esc(d.id)}${d.area?" · "+esc(d.area):""}</div></div>`;
  const open = D.decisions.filter(d => d.status === "open"), done = D.decisions.filter(d => d.status !== "open");
  return `<div class="sub-h" style="margin-top:0">Open (${open.length})</div><div class="list">${open.map(card).join("")||'<div class="empty">None.</div>'}</div>
    <div class="sub-h">Decided and working principles (${done.length})</div><div class="list">${done.map(card).join("")}</div>`;
}

function renderChanges(){
  const list = [...D.changelog].sort((a,b) => b.date.localeCompare(a.date));
  return `<div class="list">` + list.map(c => `<div class="item"><div class="h"><b>${fmtDate(c.date)}</b></div>
    <div class="s" style="color:var(--text)">${esc(c.summary)}</div>
    ${c.ids&&c.ids.length?`<div class="s">${c.ids.map(linkFor).join(" ")}</div>`:""}</div>`).join("") + `</div>`;
}

function renderPanel(){
  const R = {tasks:renderTasks, contacts:renderContacts, licences:renderLicences, documents:renderDocuments, decisions:renderDecisions, changes:renderChanges};
  $("#panel").innerHTML = (R[tab] || renderTasks)();
  if (tab === "tasks") {
    ["status","area","owner","group"].forEach(k => $("#f-"+k).onchange = e => { F[k] = e.target.value; set("filters", F); renderPanel(); });
    const qi = $("#f-q");
    qi.oninput = e => { F.q = e.target.value; set("filters", F); const pos = qi.selectionStart; renderPanel(); const n = $("#f-q"); n.focus(); n.setSelectionRange(pos,pos); };
  }
}

// Jump to a task or decision from any link.
document.addEventListener("click", e => {
  const a = e.target.closest("[data-goto]"); if(!a) return;
  e.preventDefault();
  tab = a.dataset.goto; set("tab", tab);
  if (tab === "tasks") { F.status = ""; F.area = ""; F.owner = ""; F.q = ""; }
  renderTabs(); renderPanel();
  const el = document.getElementById((tab==="tasks"?"task-":"dec-") + a.dataset.id);
  if (el) { el.scrollIntoView({behavior:"smooth", block:"center"}); el.classList.add("hl"); setTimeout(() => el.classList.remove("hl"), 1800); }
});

load();
})();
</script>
</body>
</html>
